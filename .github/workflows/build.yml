name: Build Combined Spotify IPA (Eevee + spoti.pw)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download URL to decrypted Spotify 9.1.84 IPA'
        required: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make ldid dpkg
          python3 -m venv "$RUNNER_TEMP/pyzule-venv"
          "$RUNNER_TEMP/pyzule-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pyzule-venv/bin/python" -m pip install "cyan @ git+https://github.com/asdfzxcvbn/pyzule-rw" pillow
          echo "$RUNNER_TEMP/pyzule-venv/bin" >> "$GITHUB_PATH"

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos

      - name: Download Decrypted Spotify IPA
        run: |
          mkdir -p ipa
          curl -L -o ipa/spotify.ipa "${{ github.event.inputs.ipa_url }}"

      - name: Compute Build Version
        id: versioning
        run: |
          BUILD_NUM="${{ github.run_number }}"
          OFFSET=32
          VER="0.22.$((BUILD_NUM + OFFSET))"
          echo "$VER" > spoti.pw-main/version.txt
          echo "tag=v${VER}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "build_num=$((BUILD_NUM + OFFSET))" >> $GITHUB_OUTPUT

      - name: Build EeveeSpotify Tweak
        run: |
          cd EeveeSpotifyReincarnated-Master
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          export THEOS="$HOME/theos"
          export VERSION="${{ steps.versioning.outputs.version }}"
          export BUILD_NUMBER="${{ steps.versioning.outputs.build_num }}"
          sed -i '' "s/^Version:.*/Version: ${{ steps.versioning.outputs.version }}/" control 2>/dev/null || sed -i "s/^Version:.*/Version: ${{ steps.versioning.outputs.version }}/" control 2>/dev/null || true

          make build-eeveeswiftprotobuf

          FRAMEWORK_DIR="$THEOS/lib/iphone/rootless/EeveeSwiftProtobuf.framework"
          if [ ! -d "$FRAMEWORK_DIR" ]; then
            FRAMEWORK_DIR="$THEOS/lib/iphone/roothide/EeveeSwiftProtobuf.framework"
          fi

          test -d "$FRAMEWORK_DIR" || {
            echo "EeveeSwiftProtobuf.framework was not generated"
            find "$THEOS/lib/iphone" -maxdepth 4 -iname '*SwiftProtobuf*' -print
            exit 1
          }

          test -f "$FRAMEWORK_DIR/Modules/module.modulemap" || {
            echo "EeveeSwiftProtobuf framework has no Swift module"
            find "$FRAMEWORK_DIR" -maxdepth 4 -type f -print
            exit 1
          }

          case "$FRAMEWORK_DIR" in
            */roothide/*)
              export THEOS_PACKAGE_SCHEME=roothide
              ;;
            *)
              export THEOS_PACKAGE_SCHEME=rootless
              ;;
          esac

          make clean package

      - name: Build spoti.pw & Combine Tweaks into IPA
        run: |
          EEVEE_DEB="$(pwd)/$(ls EeveeSpotifyReincarnated-Master/packages/*.deb | head -n 1)"
          test -f "$EEVEE_DEB" || { echo "EeveeSpotify deb not found"; exit 1; }
          IPA_PATH="$(pwd)/ipa/spotify.ipa"
          OUT_PATH="$(pwd)/out/Spotify_Eevee_SpotiPW_Combined.ipa"
          mkdir -p out
          cd spoti.pw-main
          chmod +x scripts/*.sh scripts/*.py
          export THEOS="$HOME/theos"
          ./scripts/pipeline.sh "$IPA_PATH" --no-flex --extra-deb "$EEVEE_DEB" -o "$OUT_PATH"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotify_Eevee_SpotiPW_Combined
          path: out/Spotify_Eevee_SpotiPW_Combined.ipa

      - name: Release Combined IPA
        uses: softprops/action-gh-release@v2
        with:
          repository: Apnkk/Spotify-Core-Releases
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "Spotify Lifetime Core By Ares ${{ steps.versioning.outputs.tag }}"
          body: |
            ### Features
            * Combined Edition: Spotify Lifetime Premium + Spotify Core By Ares
            * 100% Ad-Free (Hardened RemoteConfig, In-Stream Killer & Auto-Skipper)
            * 17 Custom Ares App Icons with in-app switcher & previews
            * Liquid Glass UI (with On/Off toggle)
            * Dynamic color presets & theme picker
            * Audio Effects (DSP) & Synchronized Lyrics
            
            **Direct Download:** [Spotify_Eevee_SpotiPW_Combined.ipa](https://github.com/Apnkk/Spotify-Core-Releases/releases/download/${{ steps.versioning.outputs.tag }}/Spotify_Eevee_SpotiPW_Combined.ipa)
          files: out/Spotify_Eevee_SpotiPW_Combined.ipa
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update Feather and AltStore Source
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          IPA_SIZE=$(stat -f%z out/Spotify_Eevee_SpotiPW_Combined.ipa 2>/dev/null || stat -c%s out/Spotify_Eevee_SpotiPW_Combined.ipa 2>/dev/null || echo 136000000)

          git clone "https://x-access-token:${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/Apnkk/Spotify-Core-Releases.git" releases_repo
          cd releases_repo

          cat <<EOF > feather.json
          {
            "name": "Spotify Core By Ares",
            "identifier": "com.ares.spotifycore",
            "sourceURL": "https://raw.githubusercontent.com/Apnkk/Spotify-Core-Releases/main/feather.json",
            "subtitle": "Lifetime Premium + Liquid Glass",
            "description": "Spotify Core By Ares official releases repository for Feather and AltStore.",
            "iconURL": "https://raw.githubusercontent.com/Apnkk/Spotify-Core-Releases/main/assets/ares_logo.png",
            "website": "https://aress.ovh",
            "apps": [
              {
                "name": "Spotify Core",
                "bundleIdentifier": "com.spotify.client",
                "developerName": "Ares",
                "subtitle": "Lifetime Premium + Liquid Glass",
                "version": "${TAG#v}",
                "versionDate": "${NOW}",
                "versionDescription": "Release ${TAG}: Lifetime Premium + Spotify Core By Ares Combined",
                "downloadURL": "https://github.com/Apnkk/Spotify-Core-Releases/releases/download/${TAG}/Spotify_Eevee_SpotiPW_Combined.ipa",
                "localizedDescription": "Lifetime Premium features (unlimited skips, zero ads, on-demand playback, lyrics) fused with the revolutionary Liquid Glass interface, custom Ares themes, alternate icons, and audio DSP.",
                "iconURL": "https://raw.githubusercontent.com/Apnkk/Spotify-Core-Releases/main/assets/ares_logo.png",
                "tintColor": "1DB954",
                "size": ${IPA_SIZE},
                "versions": [
                  {
                    "version": "${TAG#v}",
                    "date": "${NOW}",
                    "localizedDescription": "Release ${TAG}: Lifetime Premium + Spotify Core By Ares Combined",
                    "downloadURL": "https://github.com/Apnkk/Spotify-Core-Releases/releases/download/${TAG}/Spotify_Eevee_SpotiPW_Combined.ipa",
                    "size": ${IPA_SIZE}
                  }
                ]
              }
            ]
          }
          EOF

          cp feather.json apps.json
          cp feather.json altstore.json

          git config user.name "Apnkk"
          git config user.email "apnkk@users.noreply.github.com"
          git add feather.json apps.json altstore.json
          git commit -m "chore: update manifests to ${TAG}" || true
          git push origin main || true
