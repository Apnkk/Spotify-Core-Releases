name: Test Build SpotifyCore Clean (Private Pre-release)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download URL to decrypted Spotify IPA'
        required: true
        default: 'https://github.com/Apnkk/Spotify-Core-Releases/releases/download/source-ipa-9.1.90/com.spotify.client_9.1.90_und3fined.ipa'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout Private Source Repository
        uses: actions/checkout@v4
        with:
          repository: Apnkk/Spotify-EeveeSpoti-Combined
          ref: master
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Install dependencies
        run: |
          brew install make ldid dpkg
          python3 -m venv "$RUNNER_TEMP/pyzule-venv"
          "$RUNNER_TEMP/pyzule-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pyzule-venv/bin/python" -m pip install "cyan @ git+https://github.com/asdfzxcvbn/pyzule-rw" pillow
          echo "$RUNNER_TEMP/pyzule-venv/bin" >> "$GITHUB_PATH"

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos

      - name: Download Decrypted Spotify IPA
        run: |
          mkdir -p ipa
          curl -L -o ipa/spotify.ipa "${{ github.event.inputs.ipa_url }}"

      - name: Set Version
        run: |
          echo "1.0.0-beta.3" > spoti.pw-main/version.txt

      - name: Restore Cached EeveeSpotify
        id: cache-eevee
        uses: actions/cache/restore@v4
        with:
          path: EeveeSpotifyReincarnated-Master/packages
          key: eevee-deb-${{ runner.os }}-${{ hashFiles('EeveeSpotifyReincarnated-Master/Sources/**', 'EeveeSpotifyReincarnated-Master/Makefile') }}

      - name: Build EeveeSpotify Tweak
        if: steps.cache-eevee.outputs.cache-hit != 'true'
        run: |
          cd EeveeSpotifyReincarnated-Master
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          export THEOS="$HOME/theos"
          export VERSION="7.0.0"
          export BUILD_NUMBER="1"
          sed -i '' "s/^Version:.*/Version: 7.0.0/" control 2>/dev/null || sed -i "s/^Version:.*/Version: 7.0.0/" control 2>/dev/null || true

          make build-eeveeswiftprotobuf

          FRAMEWORK_DIR="$THEOS/lib/iphone/rootless/EeveeSwiftProtobuf.framework"
          if [ ! -d "$FRAMEWORK_DIR" ]; then
            FRAMEWORK_DIR="$THEOS/lib/iphone/roothide/EeveeSwiftProtobuf.framework"
          fi

          test -d "$FRAMEWORK_DIR" || {
            echo "EeveeSwiftProtobuf.framework was not generated"
            find "$THEOS/lib/iphone" -maxdepth 4 -iname '*SwiftProtobuf*' -print
            exit 1
          }

          test -f "$FRAMEWORK_DIR/Modules/module.modulemap" || {
            echo "EeveeSwiftProtobuf framework has no Swift module"
            find "$FRAMEWORK_DIR" -maxdepth 4 -type f -print
            exit 1
          }

          case "$FRAMEWORK_DIR" in
            */roothide/*)
              export THEOS_PACKAGE_SCHEME=roothide
              ;;
            *)
              export THEOS_PACKAGE_SCHEME=rootless
              ;;
          esac

          make clean package

      - name: Save Cached EeveeSpotify
        if: steps.cache-eevee.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: EeveeSpotifyReincarnated-Master/packages
          key: eevee-deb-${{ runner.os }}-${{ hashFiles('EeveeSpotifyReincarnated-Master/Sources/**', 'EeveeSpotifyReincarnated-Master/Makefile') }}

      - name: Build SpotifyCore & Inject EeveeSpotify into SpotifyCore.ipa
        run: |
          EEVEE_DEB="$(pwd)/$(ls EeveeSpotifyReincarnated-Master/packages/*.deb | head -n 1)"
          test -f "$EEVEE_DEB" || { echo "EeveeSpotify deb not found"; exit 1; }
          IPA_PATH="$(pwd)/ipa/spotify.ipa"
          OUT_PATH="$(pwd)/out/SpotifyCore.ipa"
          mkdir -p out
          cd spoti.pw-main
          chmod +x scripts/*.sh scripts/*.py
          export THEOS="$HOME/theos"
          ./scripts/pipeline.sh "$IPA_PATH" --no-flex --extra-deb "$EEVEE_DEB" -o "$OUT_PATH"

      - name: Release Test IPA (Private Pre-release)
        uses: softprops/action-gh-release@v2
        with:
          repository: Apnkk/Spotify-Core-Releases
          tag_name: test-spotifycore-clean
          name: "SpotifyCore Clean Test Build"
          body: |
            ### SpotifyCore 1.0.0-beta.3 Clean Build (Spotify 9.1.90)
            * **Fichier IPA** : `SpotifyCore.ipa`
            * **Base Spotify** : `9.1.90` (Officiel décrypté)
            * **Version Mod** : `1.0.0-beta.3` (100% propre, sans télémétrie Chroma, aucun compte ou paiement requis)
            * **Visualizer Metal natif** :
              * 5 Shaders complets inclus : `Bars`, `Nebula`, `Halo`, `Poster`, `Cut` + support Custom .metal
              * Option `Shuffle shaders on track change` (Changement aléatoire de shader à chaque morceau)
              * Option `Ignore heat warnings` (Performances Metal débridées)
            * **Fluid Artwork** : Contrôle du `Grain` (Film grain)
            * **Player Apple Music & Liquid Glass** :
              * `Music app top bar` & `Music app icons` (SF Symbols)
              * `Lyrics line under the cover` (Paroles synchronisées sous la pochette)
              * `Drag to open` & `Glass queue and device panels`
            * **Sélecteur d'apparence visuelle & Thème** :
              * Choix direct entre `Apple Music` (Liquid Glass moderne) et `Spotify Classic` (UI native)
              * Couleur d'accentuation automatique (`spotifyglass.redesign.accent.auto`) extraite de la pochette en temps réel
              * Icônes soignées (`spotifyglass.redesign.prettierIcons`) : pastilles de téléchargement translucides et badges SF Symbol épurés
            * **Nouvelles fonctionnalités & Écrans** :
              * `Albums` : Pochette plein écran edge-to-edge (`fullCover`), Nombre d'écoutes (`playCounts`), Notes éditoriales (`hideNotes`)
              * `Home` : Épuration du flux avec masquage de l'IA DJ (`hideDJ`) et de la grille de raccourcis (`hideShortcuts`)
              * `Library` : Masquage des puces de filtres (`hideChips`) avec ajustement dynamique d'inset
              * `Playlists` : Pochette plein écran (Full screen cover)
              * `Search` : Masquage des carrousels vidéo courts & Shortcuts gap
              * `Settings backup` : Exportation, Importation et Réinitialisation JSON
            * **17 Icônes Ares personnalisées** disponibles
            
            **Direct Download:** [SpotifyCore.ipa](https://github.com/Apnkk/Spotify-Core-Releases/releases/download/test-spotifycore-clean/SpotifyCore.ipa)
          prerelease: true
          files: out/SpotifyCore.ipa
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
